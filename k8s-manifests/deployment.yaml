apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: lab-app:dev
        imagePullPolicy: Never
        ports:
          - containerPort: 5000
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health # Aplikacja musi mieć ten endpoint
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10