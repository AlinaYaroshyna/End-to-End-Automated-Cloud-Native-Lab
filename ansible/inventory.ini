# Host, na którym działa KVM/libvirt - tu uruchamiamy provisioning VM-ek
[hypervisor]
localhost ansible_connection=local

# Węzły klastra Kubernetes - adresy IP muszą być identyczne
# z tymi zdefiniowanymi w group_vars/all.yml (sekcja "vms")
[k8s_master]
k8s-master ansible_host=192.168.122.10

[k8s_workers]
k8s-worker1 ansible_host=192.168.122.11
k8s-worker2 ansible_host=192.168.122.12

[k8s_nodes:children]
k8s_master
k8s_workers
