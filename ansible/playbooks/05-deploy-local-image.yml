---
- name: Distribute local Docker image to Kubernetes workers
  hosts: k8s_workers
  become: yes
  vars:
    image_name: "lab-app:dev"
    tar_file: "lab-app.tar"

  tasks:
    - name: Save Docker image locally (Runs on your host)
      delegate_to: localhost
      become: no
      run_once: true
      command: "docker save -o {{ tar_file }} {{ image_name }}"

    - name: Copy image tarball to worker nodes
      copy:
        src: "{{ tar_file }}"
        dest: "/tmp/{{ tar_file }}"

    - name: Import image into containerd on workers
      command: "ctr -n k8s.io images import /tmp/{{ tar_file }}"

    - name: Clean up temporary tarball on workers to save space
      file:
        path: "/tmp/{{ tar_file }}"
        state: absent